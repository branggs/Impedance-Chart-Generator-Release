<svg xmlns="http://www.w3.org/2000/svg" width="300" height="56" viewBox="0 0 300 56" role="img" aria-label="Download for Windows">
  <!-- the app's primary button (light theme): Windows accent fill, white text, 1px darker bottom edge -->
  <defs>
    <linearGradient id="edge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".08"/>
      <stop offset="1" stop-color="#000000" stop-opacity=".18"/>
    </linearGradient>
  </defs>
  <rect x="0.5" y="0.5" width="299" height="55" rx="6" fill="#005fb8"/>
  <rect x="0.5" y="0.5" width="299" height="55" rx="6" fill="none" stroke="url(#edge)"/>
  <g transform="translate(34 18)" fill="#ffffff">
    <rect x="0" y="0" width="9.5" height="9.5" rx="1"/><rect x="10.5" y="0" width="9.5" height="9.5" rx="1"/>
    <rect x="0" y="10.5" width="9.5" height="9.5" rx="1"/><rect x="10.5" y="10.5" width="9.5" height="9.5" rx="1"/>
  </g>
  <text x="167" y="34.5" text-anchor="middle" fill="#ffffff"
    font-family="'Segoe UI Variable Text', 'Segoe UI', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif"
    font-size="18" font-weight="600">Download for Windows</text>
</svg>
