name: Publish Windows release
on:
  push:
    branches: [main]
    paths:
      - 'downloads/**'
      - 'VERSION'
      - 'RELEASE-NOTES.md'
      - '.github/workflows/publish-release.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: publish-windows-release
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify packaged download
        run: |
          cd downloads
          sha256sum --check SHA256SUMS.txt
          unzip -t ImpedanceTable-Windows.zip
      - name: Publish release and download assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          version="$(tr -d '\r\n' < VERSION)"
          [[ "$version" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo 'Invalid release version'; exit 1; }
          if gh release view "$version" >/dev/null 2>&1; then
            echo "Release $version already exists; versioned releases are not overwritten."
            exit 0
          fi
          gh release create "$version" downloads/ImpedanceTable-Windows.zip downloads/SHA256SUMS.txt --target "$GITHUB_SHA" --title "Impedance Table $version" --notes-file RELEASE-NOTES.md --latest
